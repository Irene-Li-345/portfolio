<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rose &amp; Graphite | Before and after</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #3d3539; background: #eeecee; font: 14px/1.6 Arial, sans-serif; }
    header { padding: 24px 28px 16px; }
    h1 { margin: 0 0 8px; font: 30px Georgia, serif; }
    header p { margin: 0; color: #62595f; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 28px 28px; }
    section { min-width: 0; }
    .label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 12px; }
    h2 { font-size: 15px; margin: 0; }
    .swatch { display: inline-block; width: 18px; height: 18px; vertical-align: middle; border: 1px solid #d5d0d2; margin-right: 8px; }
    a { color: #705361; font-size: 12px; }
    iframe { display: block; width: 100%; height: 78vh; border: 1px solid #d5d0d2; background: white; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; padding-inline: 16px; } header { padding-inline: 16px; } iframe { height: 75vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Rose &amp; Graphite: before &amp; after</h1>
    <p>Only the main background changes. Rose sections, typography, and accents stay the same. Scroll inside either preview to explore.</p>
  </header>
  <main>
    <section aria-labelledby="before-heading">
      <div class="label"><h2 id="before-heading"><span class="swatch" style="background:#fdfbfa" aria-hidden="true"></span>Before · Ivory #FDFBFA</h2><a href="rose-before.html" target="_blank" rel="noopener">Open full size ↗</a></div>
      <iframe src="rose-before.html" title="Before: original ivory background"></iframe>
    </section>
    <section aria-labelledby="after-heading">
      <div class="label"><h2 id="after-heading"><span class="swatch" style="background:#ffffff" aria-hidden="true"></span>After · White #FFFFFF</h2><a href="refined-rose.html" target="_blank" rel="noopener">Open full size ↗</a></div>
      <iframe src="refined-rose.html" title="After: updated white background"></iframe>
    </section>
  </main>
</body>
</html>
