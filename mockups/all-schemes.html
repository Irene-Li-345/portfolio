      { name: 'Original homepage', path: '../index.html', description: 'Warm off-white, charcoal, and subtle pink.', colors: ['#faf9f6','#262b29','#f1e5e6'] },
      { name: 'Sage & Rose', path: 'sage.html', description: 'Soft sage, barely pink, and pale oat.', colors: ['#fafbf7','#e7efe3','#f5e9e8','#f1f0e3'] },
      { name: 'Lavender & Cloud', path: 'lavender.html', description: 'Cloud white, lavender, blush, and powder blue.', colors: ['#fcfafc','#ece8f5','#f5e8ee','#e9eef5'] },
      { name: 'Cream & Apricot', path: 'peach.html', description: 'Ivory, pale apricot, dusty pink, and light linen.', colors: ['#fffcf7','#faeadd','#f4e6e5','#efefdf'] },
      { name: 'Professional neutral', path: 'professional.html', description: 'Off-white and charcoal with a trace of rose.', colors: ['#fcfbf9','#292b2e','#c6b4bc'] },
      { name: 'Blue Mist', path: 'refined-mist.html', description: 'Cool white, slate blue, and pale blue sections.', colors: ['#fbfcfd','#edf2f6','#5d7488','#f3e9ed'] },
      { name: 'Sage Stone', path: 'refined-stone.html', description: 'Warm white, muted olive, and soft rose details.', colors: ['#fcfcf9','#eef1e9','#687b64','#f2e9e8'] },
      { name: 'Rose & Graphite — ivory', path: 'rose-before.html', description: 'Original ivory background with pale rose and mauve.', colors: ['#fdfbfa','#f5edef','#8a6c79','#3d3539'] },
      { name: 'Rose & Graphite — white', path: 'refined-rose.html', description: 'White background with the same pale rose and mauve.', colors: ['#ffffff','#f5edef','#8a6c79','#3d3539'] }
    ];
    const select = document.querySelector('#scheme');
    const frame = document.querySelector('#preview');
    const tagline = document.querySelector('#tagline');
    schemes.forEach((scheme, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = scheme.name;
      select.append(option);
    });
    select.value = '8';
    function updateTagline() {
      const heading = frame.contentDocument?.querySelector('h1');
      if (!heading) return;
      heading.replaceChildren(document.createTextNode('Hello, I’m Irene Li.'));
      if (tagline.checked) {
        const line = document.createElement('span');
        line.textContent = 'Curiosity into code.';
        heading.append(document.createElement('br'), line);
      }
    }
    function showScheme() {
      const index = Number(select.value);
      const scheme = schemes[index];
      const base = new URL(scheme.path, location.href).href;
      const source = tagline.checked ? previews[scheme.path] : previews[scheme.path].replace(/<br><span>Curiosity into code\.<\/span>/, "");
      frame.srcdoc = source.replace('<head>', '<head><base href="' + base + '">');
      frame.title = scheme.name + ' homepage preview';
      document.querySelector('#count').textContent = (index + 1) + ' of ' + schemes.length;
      document.querySelector('#description').textContent = scheme.description;
      const swatches = document.querySelector('#swatches');
      swatches.replaceChildren();
      scheme.colors.forEach(color => {
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = color;
        swatch.title = color;
        swatches.append(swatch);
      });
    }

    tagline.addEventListener('change', showScheme);
    select.addEventListener('change', showScheme);
    function move(direction) { select.value = (Number(select.value) + direction + schemes.length) % schemes.length; showScheme(); }
    document.querySelector('#previous').addEventListener('click', () => move(-1));
    document.querySelector('#next').addEventListener('click', () => move(1));
    showScheme();
  </script>
