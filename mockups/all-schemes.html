<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irene Li | All color schemes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #33343a; background: #f3f3f1; font: 14px/1.5 Arial, sans-serif; }
    header { padding: 18px 24px 12px; background: #fff; border-bottom: 1px solid #dededb; }
    h1 { font: 25px Georgia, serif; margin: 0 0 5px; }
    header p { color: #67676d; margin: 0 0 14px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    select, button { font: inherit; color: inherit; background: #fff; border: 1px solid #c9c9c5; border-radius: 4px; padding: 9px 12px; }
    button { cursor: pointer; }
    button:hover { background: #f0f0ed; }
    select { max-width: 100%; }
    label { display: inline-flex; align-items: center; gap: 7px; }
    input { accent-color: #725c67; }
    .details { padding: 10px 24px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    #description { flex: 1; min-width: 180px; color: #57585d; }
    #swatches { display: flex; gap: 5px; }
    .swatch { width: 26px; height: 18px; border: 1px solid #00000018; border-radius: 3px; }
    iframe { display: block; width: calc(100% - 32px); height: calc(100dvh - 200px); min-height: 400px; margin: 0 auto 16px; border: 1px solid #d8d8d4; background: white; }
    :focus-visible { outline: 2px solid #725c67; outline-offset: 3px; }
    @media(max-width: 650px) { header { padding: 16px; } .details { padding-inline: 16px; } iframe { height: 70dvh; } }
  </style>
</head>
<body>
  <header>
    <h1>All your color schemes</h1>
    <p>Browse the original homepage and every color direction. No final scheme has been selected.</p>
    <div class="controls">
      <button id="previous" type="button" aria-label="Previous color scheme">← Previous</button>
      <label for="scheme">Color scheme <select id="scheme"></select></label>
      <button id="next" type="button" aria-label="Next color scheme">Next →</button>
      <span id="count" aria-live="polite"></span>
    </div>
  </header>
  <div class="details"><span id="description" aria-live="polite"></span><div id="swatches" aria-label="Palette colors"></div></div>
  <iframe id="preview" title="Homepage color scheme preview" src="refined-rose.html"></iframe>
  <script>
    const schemes = [
      { name: 'Original homepage', path: '../index.html', description: 'Warm off-white, charcoal, and subtle pink.', colors: ['#faf9f6','#262b29','#f1e5e6'] },
      { name: 'Sage & Rose', path: 'sage.html', description: 'Soft sage, barely pink, and pale oat.', colors: ['#fafbf7','#e7efe3','#f5e9e8','#f1f0e3'] },
      { name: 'Lavender & Cloud', path: 'lavender.html', description: 'Cloud white, lavender, blush, and powder blue.', colors: ['#fcfafc','#ece8f5','#f5e8ee','#e9eef5'] },
      { name: 'Cream & Apricot', path: 'peach.html', description: 'Ivory, pale apricot, dusty pink, and light linen.', colors: ['#fffcf7','#faeadd','#f4e6e5','#efefdf'] },
      { name: 'Professional neutral', path: 'professional.html', description: 'Off-white and charcoal with a trace of rose.', colors: ['#fcfbf9','#292b2e','#c6b4bc'] },
      { name: 'Blue Mist', path: 'refined-mist.html', description: 'Cool white, slate blue, and pale blue sections.', colors: ['#fbfcfd','#edf2f6','#5d7488','#f3e9ed'] },
      { name: 'Sage Stone', path: 'refined-stone.html', description: 'Warm white, muted olive, and soft rose details.', colors: ['#fcfcf9','#eef1e9','#687b64','#f2e9e8'] },
      { name: 'Rose & Graphite — ivory', path: 'rose-before.html', description: 'Original ivory background with pale rose and mauve.', colors: ['#fdfbfa','#f8eeeb','#94685f','#3d3539'] },
      { name: 'Rose & Graphite — white', path: 'refined-rose.html', description: 'White background with the same pale rose and mauve.', colors: ['#ffffff','#f8eeeb','#94685f','#3d3539'] }
    ];
    const select = document.querySelector('#scheme');
    const frame = document.querySelector('#preview');
    schemes.forEach((scheme, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = scheme.name;
      select.append(option);
    });
    select.value = '8';
    function showScheme() {
      const index = Number(select.value);
      const scheme = schemes[index];
      frame.src = scheme.path;
      frame.title = scheme.name + ' homepage preview';
      document.querySelector('#count').textContent = (index + 1) + ' of ' + schemes.length;
      document.querySelector('#description').textContent = scheme.description;
      const swatches = document.querySelector('#swatches');
      swatches.replaceChildren();
      scheme.colors.forEach(color => {
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.background = color;
        swatch.title = color;
        swatches.append(swatch);
      });
    }

    select.addEventListener('change', showScheme);
    function move(direction) { select.value = (Number(select.value) + direction + schemes.length) % schemes.length; showScheme(); }
    document.querySelector('#previous').addEventListener('click', () => move(-1));
    document.querySelector('#next').addEventListener('click', () => move(1));
    showScheme();
  </script>
</body>
</html>
